# Deployed by .github/workflows/cloudflare.yml (wrangler deploy). Runs every minute; see index.js.
name = "reminth-cron"
main = "index.js"
compatibility_date = "2026-09-01"
workers_dev = false
# keep settings added in the Cloudflare dashboard (like DISCORD_BOT_TOKEN as Text) when GitHub uploads a new version
keep_vars = true

[triggers]
crons = ["* * * * *"]

# the bot's always-on connection to Discord (shows it as online) - see index.js
[[durable_objects.bindings]]
name = "GATEWAY"
class_name = "Gateway"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Gateway"]
