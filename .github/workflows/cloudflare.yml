# Uploads site/ (and the account server in functions/, which Wrangler finds next to it) to the Cloudflare Pages project "reminth" (https://reminth.pages.dev) whenever it changes on main.
# That project is a Direct Upload project (Cloudflare can't connect those to Git later), so GitHub uploads it with
# Wrangler, Cloudflare's own tool - the same as dragging the site folder into the dashboard.
# Needs (Settings -> Secrets and variables -> Actions), added by the owner:
#   CLOUDFLARE_API_TOKEN  - a Cloudflare API token with "Cloudflare Pages: Edit" (should be a SECRET)
#   CLOUDFLARE_ACCOUNT_ID - the Cloudflare account id (a secret or a variable)
# Each is read as a secret first, then as a variable. The log says which exist, never their values.
# The token must have no IP filter (GitHub uploads from changing addresses - Cloudflare error 9109 otherwise).
name: Website to Cloudflare

on:
  push:
    branches: [main]
    paths: ['site/**', 'functions/**', 'workers/**', '.github/workflows/cloudflare.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Which settings exist (never their values)
        run: |
          echo "token as secret: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}, as variable: ${{ vars.CLOUDFLARE_API_TOKEN != '' }}"
          echo "account id as secret: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}, as variable: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}"
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then echo "Missing - nothing uploaded."; fi
      - uses: actions/checkout@v4
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
      - name: Upload site/ to Cloudflare Pages
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          echo "::add-mask::$CF_ACCOUNT"
          set -o pipefail
          if ! npx --yes wrangler@4 pages deploy site --project-name=reminth --branch=main --commit-dirty=true 2>&1 | tee out.txt; then
            # Cloudflare's own error, shown as an error note on the run (the account id is masked)
            grep -iE "error|authentication|permission|not found|code" out.txt | tail -5 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi
      - name: Upload the every-minute bot check (workers/cron)
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        # needs the token permission "Workers Scripts: Edit" - if it's missing only this step fails, the website is uploaded
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        working-directory: workers/cron
        run: |
          set -o pipefail
          if ! npx --yes wrangler@4 deploy 2>&1 | tee out.txt; then
            # Cloudflare's whole answer, without colours, as notes on the run (the account id is masked)
            sed -e 's/\[[0-9;]*m//g' out.txt | grep -v "^\s*$" | tail -15 | while read -r l; do echo "::warning::$l"; done
            exit 1
          fi
