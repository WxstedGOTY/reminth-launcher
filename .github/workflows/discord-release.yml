# When a release is published on GitHub, posts "Reminth X is out" with its notes in the Discord updates channel.
# Needs the repository secret DISCORD_UPDATES_WEBHOOK (Discord: the channel's settings -> Integrations -> Webhooks ->
# New Webhook -> Copy Webhook URL). Without it this does nothing.
name: Announce release on Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to announce again (e.g. 1.7.0)"
        required: true

jobs:
  announce:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Post to Discord
        env:
          HOOK: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$HOOK" ]; then echo "No DISCORD_UPDATES_WEBHOOK secret - nothing posted."; exit 0; fi
          curl -sSf -H "authorization: Bearer $GH_TOKEN" -H "accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG" > release.json
          node tools/release-to-discord.js release.json > payload.json
          curl -sSf -H "content-type: application/json" -d @payload.json "$HOOK"
          echo "Posted."
